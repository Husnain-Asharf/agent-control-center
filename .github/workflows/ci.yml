# Pinned action versions should be kept current. Dependabot proposes bumps.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 for its older glibc, so the Linux builds run on most distributions.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Runs as bash -eo pipefail, so a command piped to tee still fails its step.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 23
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: npm-ci
        run: npm ci
      # Each check keeps its output in a log and runs even when an earlier
      # check failed. The last step reports the ones that failed.
      - id: npm-test
        name: npm test
        run: npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
      # The Tauri crate needs dist/ to exist.
      - id: build
        name: npm run build
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
      # tauri-build needs the externalBin sidecars to exist.
      - id: sidecars
        name: npm run sidecars
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run sidecars 2>&1 | tee "$RUNNER_TEMP/sidecars.log"
      # Terse output, and every test binary runs, so the last lines of the log
      # hold all the failures.
      - id: cargo-test
        name: cargo test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sidecars.outcome == 'success' }}
        run: cargo test --workspace --no-fail-fast -- --quiet 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      # One annotation per failed check, with the last 120 lines of its log, so
      # a failure can be read from the check run's annotations. GitHub keeps
      # the first 4096 characters of an annotation, so at most the last 4000
      # characters of those lines are sent.
      - name: Report failures
        if: failure()
        env:
          NPM_TEST: ${{ steps.npm-test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SIDECARS: ${{ steps.sidecars.outcome }}
          CARGO_TEST: ${{ steps.cargo-test.outcome }}
        run: |
          report() {
            local outcome=$1 step=$2 log=$3 text
            if [ "$outcome" != failure ] || [ ! -f "$log" ]; then
              return 0
            fi
            # Without color codes, cut to whole lines in the last 4000
            # characters, and with %, CR and LF encoded, so all the lines
            # arrive as one multi-line annotation.
            text=$(tail -n 120 "$log" | perl -0777 -ne '
              s/\e\[[0-9;?]*[ -\/]*[@-~]//g; s/\n+\z//;
              if (length > 4000) { $_ = substr($_, -4000); s/\A[^\n]*\n//; }
              s/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; print')
            echo "::error title=$step output::$text"
          }
          report "$NPM_TEST" "npm test" "$RUNNER_TEMP/npm-test.log"
          report "$BUILD" "npm run build" "$RUNNER_TEMP/build.log"
          report "$SIDECARS" "npm run sidecars" "$RUNNER_TEMP/sidecars.log"
          report "$CARGO_TEST" "cargo test" "$RUNNER_TEMP/cargo-test.log"

  # Builds the Windows installers and checks that they end a running accd when
  # they upgrade, install again or uninstall the app. The v0.3.0 installers,
  # which do not, are run the same way for comparison and only reported.
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 23
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - id: bundle
        name: Build the installers
        shell: bash
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi 2>&1 | tee "$RUNNER_TEMP/bundle.log"
      - name: Check the installers with accd running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $results = [System.Collections.Generic.List[string]]::new()
          $data = Join-Path $env:RUNNER_TEMP 'acc-data'
          New-Item -ItemType Directory -Force $data | Out-Null

          # Runs a program, waits for it alone, and returns its exit code.
          function Invoke-Program([string]$file, [string]$arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(600000)) { throw "$file $arguments did not end in 10 minutes" }
            return $p.ExitCode
          }
          # msiexec with a verbose log. Prints what the log says about accd and files in use.
          function Invoke-Msi([string]$verb, [string]$package, [string]$name) {
            $log = Join-Path $env:RUNNER_TEMP "$name.log"
            $code = Invoke-Program 'msiexec.exe' "$verb `"$package`" /qn /norestart /l*v `"$log`""
            $lines = Select-String -Path $log -ErrorAction SilentlyContinue -Pattern 'StopAccd|in use|RMFilesInUse|Restart Manager|Return value 3' |
              Select-Object -First 15 | ForEach-Object { $_.Line.Trim() }
            Write-Host "$name ($code):`n$($lines -join "`n")"
            return $code
          }
          # Starts an installed accd as the app does, and checks that it keeps running.
          function Start-Accd([string]$exe) {
            $p = Start-Process -FilePath $exe -ArgumentList "--data-dir `"$data`"" -WindowStyle Hidden -PassThru
            $null = $p.Handle
            Start-Sleep -Seconds 3
            if ($p.HasExited) { throw "$exe exited at once with $($p.ExitCode)" }
            $path = (Get-Process -Id $p.Id).Path
            if ($path -ne $exe) { throw "the accd that runs is $path, not $exe" }
            return $p
          }
          function Stop-Accd($p) {
            if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
          }
          # Bytes added at the end leave accd runnable, and show whether an installer wrote it again.
          function Set-Stale([string]$exe) {
            [IO.File]::AppendAllText($exe, 'stale')
            return (Get-FileHash $exe).Hash
          }
          function Check([bool]$ok, [string]$what) {
            $results.Add($(if ($ok) { "ok: $what" } else { "FAILED: $what" }))
          }
          function Note-Old([string]$what) { $results.Add("v0.3.0: $what") }

          try {
            $bundle = 'target/x86_64-pc-windows-msvc/release/bundle'
            $setup = (Get-Item "$bundle/nsis/*-setup.exe").FullName
            $msi = (Get-Item "$bundle/msi/*.msi").FullName
            $current = (Get-FileHash 'src-tauri/binaries/accd-x86_64-pc-windows-msvc.exe').Hash
            $release = 'https://github.com/Husnain-Asharf/agent-control-center/releases/download/v0.3.0'
            $oldSetup = Join-Path $env:RUNNER_TEMP 'old-setup.exe'
            $oldMsi = Join-Path $env:RUNNER_TEMP 'old.msi'
            Invoke-WebRequest "$release/Agent.Control.Center_0.3.0_x64-setup.exe" -OutFile $oldSetup
            Invoke-WebRequest "$release/Agent.Control.Center_0.3.0_x64_en-US.msi" -OutFile $oldMsi

            # The NSIS setup.exe installs for the current user.
            $dir = Join-Path $env:LOCALAPPDATA 'Agent Control Center'
            $accd = Join-Path $dir 'accd.exe'
            $uninstall = Join-Path $dir 'uninstall.exe'

            $code = Invoke-Program $oldSetup '/S'
            Check ($code -eq 0 -and (Test-Path $accd)) "v0.3.0 setup.exe installs: exit $code"
            Check ((Get-FileHash $accd).Hash -ne $current) 'the v0.3.0 accd.exe differs from this build'
            $stale = Set-Stale $accd
            $p = Start-Accd $accd
            $code = Invoke-Program $oldSetup '/S'
            Note-Old "setup.exe again while accd runs: exit $code, accd.exe written again: $((Get-FileHash $accd).Hash -ne $stale), accd ended: $($p.HasExited)"

            if ($p.HasExited) { $p = Start-Accd $accd }
            $code = Invoke-Program $setup '/S'
            Check ($code -eq 0) "setup.exe upgrades v0.3.0 while accd runs: exit $code"
            Check $p.HasExited 'setup.exe ended the running v0.3.0 accd'
            Check ((Get-FileHash $accd).Hash -eq $current) 'the installed accd.exe is this build'

            $stale = Set-Stale $accd
            $p = Start-Accd $accd
            $code = Invoke-Program $setup '/S'
            Check ($code -eq 0) "setup.exe runs again while accd runs: exit $code"
            Check $p.HasExited 'setup.exe ended the running accd'
            Check ((Get-FileHash $accd).Hash -eq $current) 'setup.exe wrote accd.exe again'

            # _?= runs the uninstaller in place, so that it can be waited for. It cannot remove itself then.
            $p = Start-Accd $accd
            $code = Invoke-Program $uninstall "/S _?=$dir"
            Check ($code -eq 0) "the uninstaller runs while accd runs: exit $code"
            Check $p.HasExited 'the uninstaller ended accd'
            $left = @(Get-ChildItem $dir -Name)
            Check ($left.Count -eq 1 -and $left[0] -eq 'uninstall.exe') "the uninstaller removed the app's files, left: $($left -join ', ')"
            Remove-Item -Recurse -Force $dir

            $code = Invoke-Program $oldSetup '/S'
            $p = Start-Accd $accd
            $code = Invoke-Program $uninstall "/S _?=$dir"
            Note-Old "uninstaller while accd runs: exit $code, accd.exe left: $(Test-Path $accd), accd ended: $($p.HasExited)"
            Stop-Accd $p
            Remove-Item -Recurse -Force $dir

            # The .msi installs for all users.
            $pf = Join-Path $env:ProgramFiles 'Agent Control Center'
            $accd = Join-Path $pf 'accd.exe'

            $code = Invoke-Msi '/i' $oldMsi 'old-install'
            Check ($code -eq 0 -and (Test-Path $accd)) "v0.3.0 .msi installs: exit $code"
            $p = Start-Accd $accd
            $code = Invoke-Msi '/x' $oldMsi 'old-uninstall'
            Note-Old ".msi removed while accd runs: exit $code, accd.exe left: $(Test-Path $accd), accd ended: $($p.HasExited)"
            Stop-Accd $p
            $null = Invoke-Msi '/x' $oldMsi 'old-uninstall-again'
            if (Test-Path $pf) { Remove-Item -Recurse -Force $pf }

            $code = Invoke-Msi '/i' $oldMsi 'old-install-again'
            Check ($code -eq 0 -and (Test-Path $accd)) "v0.3.0 .msi installs again: exit $code"
            $p = Start-Accd $accd
            $code = Invoke-Msi '/i' $msi 'upgrade'
            Check ($code -eq 0) "the .msi upgrades v0.3.0 while accd runs: exit $code"
            Check $p.HasExited 'the .msi ended the running v0.3.0 accd'
            Check ((Get-FileHash $accd).Hash -eq $current) 'the installed accd.exe is this build'

            $p = Start-Accd $accd
            $code = Invoke-Msi '/x' $msi 'uninstall'
            Check ($code -eq 0) "the .msi is removed while accd runs: exit $code"
            Check $p.HasExited 'the .msi removal ended accd'
            Check (-not (Test-Path $accd)) 'the .msi removal removed accd.exe'
          } catch {
            $results.Add("FAILED: $($_.Exception.Message) (line $($_.InvocationInfo.ScriptLineNumber))")
          }
          $text = ($results -join "`n").Replace('%', '%25').Replace("`n", '%0A')
          if ($results | Where-Object { $_.StartsWith('FAILED') }) { Write-Host "::error title=Installer checks::$text"; exit 1 }
          Write-Host "::notice title=Installer checks::$text"
      - name: Report a failed build
        if: failure() && steps.bundle.outcome == 'failure'
        shell: bash
        run: |
          text=$(tail -n 120 "$RUNNER_TEMP/bundle.log" | perl -0777 -ne '
            s/\e\[[0-9;?]*[ -\/]*[@-~]//g; s/\n+\z//;
            if (length > 4000) { $_ = substr($_, -4000); s/\A[^\n]*\n//; }
            s/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; print')
          echo "::error title=Build the installers::$text"
