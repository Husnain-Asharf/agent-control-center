name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a project
        2. Start a session
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and version
      placeholder: "macOS 14.5, Ubuntu 24.04 or Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Machine
      options:
        - Mac with Apple Silicon
        - Mac with Intel
        - Linux x86_64
        - Windows x64
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant accd.log lines
      description: From `~/Library/Application Support/AgentControlCenter/accd.log` on macOS, `~/.local/share/AgentControlCenter/accd.log` on Linux or `%LOCALAPPDATA%\AgentControlCenter\accd.log` on Windows. Remove secrets, tokens and private paths before pasting.
      render: text
