[package]
name = "accd"
version.workspace = true
description = "Agent Control Center daemon: sessions, worktrees, approvals and storage"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
acc-protocol = { path = "../acc-protocol" }
tokio = { version = "1.54", features = ["full"] }
portable-pty = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
uuid = { version = "1.29", features = ["v4"] }
anyhow = "1.0"
thiserror = "2.0"
which = "8.0"
libc = "0.2"
dirs = "7.0"

[dev-dependencies]
tempfile = "3.27"
