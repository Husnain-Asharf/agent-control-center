[package]
name = "accd"
version.workspace = true
description = "Agent Control Center daemon: sessions, worktrees, approvals and storage"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
acc-protocol = { path = "../acc-protocol" }
acc-transport = { path = "../acc-transport" }
tokio = { version = "1.54", features = ["full"] }
portable-pty = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
uuid = { version = "1.29", features = ["v4"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "7.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
which = "8.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"

# A stand-in for Claude Code, acc-hook and accd in the tests. It is not bundled.
[[bin]]
name = "stand-in"
path = "tests/fixtures/stand-in.rs"
test = false
doc = false
